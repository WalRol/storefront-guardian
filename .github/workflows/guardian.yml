name: Storefront Guardian

# Sin filtro de paths: es un check obligatorio de main y tiene que reportar en todos los PRs.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: guardian-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # El agente, la política y las convenciones salen de la rama base: un PR no
      # puede cambiar las reglas con las que se lo evalúa (p. ej. apagar blockOn).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      # El código del PR solo entra como ref (el merge con la base, igual que el checkout
      # por defecto): el agente lo revisa en un worktree aislado.
      - name: Traer el código del PR
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/$PR/merge:refs/remotes/pr/merge"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Instalar dependencias
        run: npm ci --prefix storefront-demo && npm ci --prefix agent

      - name: Revisar PR
        working-directory: agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Sin key (p. ej. PRs desde forks, que no reciben secretos) corre solo la capa determinística.
          GUARDIAN_PROVIDER: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || 'none' }}
          # Título y descripción los controla quien abre el PR: se pasan por variables
          # de entorno, nunca interpolados en el script, para evitar inyección de comandos.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Opcional: webhook de n8n que recibe el resultado (notificaciones y métricas).
          GUARDIAN_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          GUARDIAN_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          npx tsx src/cli.ts review --base "$BASE_REF" --head pr/merge \
            --title "$PR_TITLE" --body "$PR_BODY" --label "pr-$PR_NUMBER" \
            --pr-number "$PR_NUMBER" --pr-url "$PR_URL" --exit-zero

      - name: Comentar en el PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --body-file ".guardian-out/pr-$PR/report.md" \
            || gh pr comment "$PR" --body-file ".guardian-out/pr-$PR/report.md"

      - name: Aplicar el gate
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          VERDICT=$(node -p "require('./.guardian-out/pr-$PR/report.json').decision.verdict")
          echo "Veredicto: $VERDICT"
          echo "### Storefront Guardian: $VERDICT" >> "$GITHUB_STEP_SUMMARY"
          test "$VERDICT" != "BLOCK"
